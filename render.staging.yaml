# Blueprint de STAGING. Se llama render.staging.yaml (no render.yaml) para no mezclarse con el
# Blueprint de producción (apptrainer + apptrainer-db). Mismas variables que producción, más las de
# check-in y las de datos de prueba. Ver README: "Deploy staging en Render".
services:
  - type: web
    name: apptrainer-staging
    runtime: python
    plan: free
    region: oregon
    branch: feature/checkin-qr
    buildCommand: ./build.staging.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --threads 2 --timeout 60 --access-logfile -
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: CHECKIN_SECRET
        generateValue: true
      - key: DJANGO_TIME_ZONE
        value: America/Argentina/Buenos_Aires
      - key: DJANGO_BEHIND_PROXY
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: apptrainer-staging-db
          property: connectionString
      - key: SEED_DEMO
        value: "True"
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: TRAINER_NAME
        sync: false

databases:
  - name: apptrainer-staging-db
    plan: free
    region: oregon
    databaseName: apptrainer_staging
    user: apptrainer
