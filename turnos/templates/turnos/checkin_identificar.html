{% extends "turnos/checkin_base.html" %}
{% block checkin %}
<h1 class="text-xl font-bold mb-1">Check-in</h1>
<p class="text-slate-600 mb-4">Clase de las <strong>{{ clase.hora_inicio|time:"H:i" }}</strong>. Ingresá tu DNI para continuar.</p>
<form method="post" action="{% url 'identificar' %}" class="space-y-3">
  {% csrf_token %}<input type="hidden" name="next" value="{{ next }}">
  <input name="dni" inputmode="numeric" autocomplete="off" required placeholder="Ej: 30123456" aria-label="DNI"
         class="w-full rounded-lg border border-slate-300 px-3 py-4 text-lg">
  <button class="w-full bg-emerald-600 text-white rounded-xl py-4 text-lg font-semibold">Continuar</button>
</form>
{% endblock %}
