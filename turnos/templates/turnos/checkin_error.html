{% extends "turnos/checkin_base.html" %}
{% block checkin %}
<div class="text-center">
  <p class="text-5xl mb-2">⚠️</p>
  <h1 class="text-lg font-bold mb-2">No pudimos registrar el check-in</h1>
  <p class="text-slate-700 mb-4">{{ mensaje }}</p>
  {% if sin_saldo %}<a href="{% url 'index' %}" class="block bg-emerald-600 text-white rounded-xl py-3 font-semibold">Ver mi saldo</a>
  {% elif ir_a_lista %}<a href="{% url 'checkin_lista' %}" class="block bg-emerald-600 text-white rounded-xl py-3 font-semibold">Ingresar el código a mano</a>
  {% else %}<a href="{% url 'index' %}" class="text-sm text-slate-500 underline">Volver al calendario</a>{% endif %}
</div>
{% endblock %}
