# Blueprint de Render: crea la web y la base de datos PostgreSQL de una sola vez.
# En Render: New > Blueprint > elige este repositorio.
# Usa planes de pago (starter o superior) para que la app no se duerma
# y la base de datos conserve tus datos con backups.
databases:
  - name: apptrainer-db
    plan: basic-256mb        # PostgreSQL gestionado con backups
    databaseName: apptrainer
    user: apptrainer

services:
  - type: web
    name: apptrainer
    runtime: python
    plan: starter
    buildCommand: ./build.sh
    preDeployCommand: python manage.py migrate --no-input
    startCommand: gunicorn config.wsgi:application --workers 2 --threads 2 --timeout 60 --access-logfile -
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_TIME_ZONE
        value: America/Argentina/Buenos_Aires   # ajústala a tu país
      - key: DATABASE_URL
        fromDatabase:
          name: apptrainer-db
          property: connectionString
